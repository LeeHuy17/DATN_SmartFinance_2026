services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      OCR_MODEL_DIR: /models
      DJANGO_MIGRATE: "1"  # migrate + collectstatic khi khởi động (xem docker-entrypoint.sh)
    # Cổng 8000 chỉ mở sau khi migrate xong, nên dùng làm tín hiệu sẵn sàng cho scheduler
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - ocr_models:/models

  # Việc thông báo theo lịch: nhắc ghi chép sau 20:00, email tổng kết tháng, dọn thông báo cũ.
  # Chạy mỗi 10 phút; lệnh tự chống gửi trùng nên chạy lặp lại không sao.
  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      web:
        condition: service_healthy
    command: >
      sh -c "while true; do
               python manage.py send_scheduled_notifications;
               python manage.py cleanup_receipts;
               sleep 600;
             done"

volumes:
  postgres_data:
  static_data:
  media_data:
  ocr_models:
