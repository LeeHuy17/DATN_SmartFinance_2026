name: Docker Publish

on:
  # Merge vào main hoặc gắn tag v* thì build và đẩy image lên GHCR
  push:
    branches: [main]
    tags: ["v*"]
  # PR sửa backend chỉ build để bắt lỗi Dockerfile, không đẩy image
  pull_request:
    branches: [develop, main]
    paths:
      - "src/backend/**"
      - ".github/workflows/docker-publish.yml"

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tên image trên GHCR bắt buộc viết thường
  IMAGE: ghcr.io/leehuy17/finbuddy-backend

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Đăng nhập GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest cho main, sha-xxxxxxx cho mọi lần build, 1.2.3 và 1.2 khi gắn tag v1.2.3
      - name: Tạo tag và nhãn cho image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Cache layer qua GitHub Actions để không phải tải lại PyTorch mỗi lần build
      - name: Build và đẩy image
        uses: docker/build-push-action@v6
        with:
          context: src/backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
