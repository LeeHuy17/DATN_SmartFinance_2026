name: Mobile Release

on:
  # Gắn tag v* trên main thì build APK và đăng lên GitHub Release
  push:
    tags: ["v*"]
  # Bấm tay trên tab Actions để build lại, APK lưu ở artifact của lần chạy
  workflow_dispatch:

# Không huỷ giữa chừng: mỗi lần build tốn một lượt build EAS
concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: src/mobile

jobs:
  build:
    name: Build APK (EAS)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      # Tên nhánh có thể chứa "/" (feature/x) nên đổi thành "-" khi đặt tên file
      - name: Đặt tên file
        working-directory: .
        run: |
          NAME="FinBuddy-${GITHUB_REF_NAME//\//-}"
          echo "APK=$NAME.apk" >> "$GITHUB_ENV"
          echo "QR=$NAME-QR.png" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # Tag v1.2.3 phải khớp "version": "1.2.3" trong app.json, tránh hai APK khác nhau cùng số phiên bản
      - name: Kiểm tra version khớp tag
        if: env.IS_TAG == 'true'
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          if [ "v$APP_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME không khớp version $APP_VERSION trong app.json"
            exit 1
          fi

      # Build chạy trên máy chủ Expo, biến EXPO_PUBLIC_API_URL lấy từ môi trường preview của EAS
      - name: Build APK trên EAS
        run: |
          eas build -p android --profile preview --non-interactive --wait --json > build.json
          URL=$(jq -r '.[0].artifacts.applicationArchiveUrl' build.json)
          echo "Build: $(jq -r '.[0].id' build.json)"
          curl -fsSL -o "$APK" "$URL"

      # Link Expo hết hạn sau vài tuần nên QR trỏ tới file APK trên GitHub Release
      - name: Đăng lên GitHub Release
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          npx -y qrcode@1.5.4 -o "$QR" -w 600 -e M "$BASE/$APK"
          cat > notes.md <<EOF
          ## 📱 Tải ứng dụng FinBuddy (Android)

          Quét mã QR bằng điện thoại Android để tải file APK:

          ![QR tải FinBuddy $GITHUB_REF_NAME]($BASE/$QR)

          Hoặc tải trực tiếp: **[$APK]($BASE/$APK)**

          Cài đặt: mở file APK, cho phép **"Cài ứng dụng không rõ nguồn gốc"** nếu Android hỏi.

          SHA-256: \`$(sha256sum "$APK" | cut -d' ' -f1)\`
          EOF
          # Release đã tạo trên web thì chỉ đính kèm file, chưa có thì tạo mới
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" "$QR" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" "$QR" \
              --title "FinBuddy $GITHUB_REF_NAME" --notes-file notes.md --generate-notes --verify-tag
          fi

      - name: Lưu APK vào artifact
        if: env.IS_TAG != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: src/mobile/${{ env.APK }}
          retention-days: 30
